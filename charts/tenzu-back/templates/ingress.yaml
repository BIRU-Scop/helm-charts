{{- if .Values.ingress.enabled -}}
{{- $fullName := include "tenzu-back.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "tenzu-back.labels" . | nindent 4 }}
  annotations:
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-body-size") }}
    {{- $maxUpload := .Values.global.maxUploadFileSize }}
    {{- if or (not $maxUpload) (eq (toString $maxUpload) "null") }}
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    {{- else }}
    # add 1MiB margin more than max file size
    nginx.ingress.kubernetes.io/proxy-body-size: {{ add (int64 $maxUpload) 1048576 | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  {{- include "tenzu-back.ingressTls" . | nindent 2 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-caddy
                port:
                  number: 80
    {{- end }}
{{- if .Values.ingress.upload.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-upload
  labels:
    {{- include "tenzu-back.labels" . | nindent 4 }}
  {{- with .Values.ingress.upload.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  {{- include "tenzu-back.ingressTls" . | nindent 2 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range $.Values.ingress.upload.paths }}
          - path: {{ . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullName }}-caddy
                port:
                  number: 80
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
